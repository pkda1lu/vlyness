[package]
name = "vlyness-gui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "VLYNESS Windows GUI client (eframe): connect/disconnect, status, traffic, log."

[[bin]]
name = "vlyness-gui"
path = "src/main.rs"

[dependencies]
vlyness-cli = { path = "../vlyness-cli" }
vlyness-profile = { path = "../vlyness-profile" }
eframe = "0.28"
egui = "0.28"
rfd = "0.16"
serde = { workspace = true }
serde_json = { workspace = true }
