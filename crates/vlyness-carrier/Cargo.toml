[package]
name = "vlyness-carrier"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "VLYNESS carrier adapters: real TLS over TCP (rustls), later HTTP/2 segments + honest-fallback."

[dependencies]
vlyness-core = { path = "../vlyness-core" }
vlyness-transport = { path = "../vlyness-transport" }
vlyness-shaping = { path = "../vlyness-shaping" }
tokio.workspace = true
rustls = { version = "0.23", default-features = false, features = ["ring", "aws-lc-rs", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
h2 = "0.4"
http = "1"
bytes = "1"
tokio-util = "0.7"
# RTC/datagram-несущая: HTTP/3 + WebTransport поверх QUIC (провайдер ring — как в tls.rs).
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "bloom"] }
web-transport-quinn = { version = "0.12", default-features = false, features = ["ring"] }
url = "2"

[dev-dependencies]
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
webpki-roots = "1"
