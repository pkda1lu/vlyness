[package]
name = "vlyness-metrics"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "VLYNESS detectability harness: flow features + distribution distance to measure whether shaping matches the legend (design doc 04 §2)."

[dependencies]
vlyness-shaping = { path = "../vlyness-shaping" }
rand.workspace = true

[dev-dependencies]
vlyness-core = { path = "../vlyness-core" }
vlyness-transport = { path = "../vlyness-transport" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-util", "sync"] }
