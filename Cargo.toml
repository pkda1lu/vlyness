[workspace]
resolver = "2"
members = [
    "crates/vlyness-core",
    "crates/vlyness-discipline",
    "crates/vlyness-profile",
    "crates/vlyness-shaping",
    "crates/vlyness-transport",
    "crates/vlyness-carrier",
    "crates/vlyness-node",
    "crates/vlyness-cli",
    "crates/vlyness-metrics",
    "crates/vlyness-gui",
]
# GUI (eframe) тяжёл по зависимостям и только под десктоп — не в наборе по умолчанию,
# чтобы `cargo build`/`cargo test` были быстрыми и не тянули winit/wgpu. Сборка GUI —
# явно: `cargo build -p vlyness-gui`.
default-members = [
    "crates/vlyness-core",
    "crates/vlyness-discipline",
    "crates/vlyness-profile",
    "crates/vlyness-shaping",
    "crates/vlyness-transport",
    "crates/vlyness-carrier",
    "crates/vlyness-node",
    "crates/vlyness-cli",
    "crates/vlyness-metrics",
]

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.75"

[workspace.dependencies]
blake2 = "0.10"
chacha20poly1305 = "0.10"
snow = "0.9"
rand = "0.8"
rand_core = "0.6"
subtle = "2"
base64 = "0.22"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "io-util", "net", "sync", "time"] }
