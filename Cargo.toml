[workspace]
resolver = "2"
members = [
    "crates/vlyness-core",
    "crates/vlyness-discipline",
    "crates/vlyness-profile",
    "crates/vlyness-shaping",
    "crates/vlyness-transport",
    "crates/vlyness-carrier",
    "crates/vlyness-node",
    "crates/vlyness-cli",
]

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.75"

[workspace.dependencies]
blake2 = "0.10"
chacha20poly1305 = "0.10"
snow = "0.9"
rand = "0.8"
rand_core = "0.6"
subtle = "2"
base64 = "0.22"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "io-util", "net", "sync", "time"] }
